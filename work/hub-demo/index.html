<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Equilibra Hub · Demo Reef 7 Lab</title>
<meta name="description" content="Demo dell'hub aziendale progettato da Reef 7 Lab: tutte le piattaforme interne, il loro stato e i link di direzione in un unico posto.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root { --bg: #f7f8fb; --panel: #fff; --ink: #111827; --muted: #4b5563; --faint: #6b7280; --line: #e5e7eb; --acc: #4f5fe0; --acc-soft: #eef0ff; --ok: #16a34a; --sans: "Geist", "Segoe UI", system-ui, sans-serif; --mono: "Geist Mono", ui-monospace, monospace; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; }
  .app { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100vh; }
  .side { background: var(--panel); border-right: 1px solid var(--line); padding: 0 14px; }
  .brand { display: flex; align-items: center; gap: 10px; height: 64px; border-bottom: 1px solid var(--line); margin: 0 -14px 12px; padding: 0 22px; font-weight: 700; letter-spacing: .02em; }
  .brand small { font: 600 10px var(--mono); color: var(--acc); background: var(--acc-soft); padding: 3px 8px; border-radius: 999px; letter-spacing: .06em; }
  .nav { all: unset; display: flex; align-items: center; gap: 12px; width: 100%; box-sizing: border-box; padding: 10px 12px; border-radius: 10px; cursor: pointer; color: var(--muted); font-weight: 500; margin-bottom: 4px; }
  .nav svg { width: 18px; height: 18px; flex: none; }
  .nav:hover { background: #f3f4f6; }
  .nav[aria-current="page"] { background: var(--acc-soft); color: var(--ink); box-shadow: inset 0 0 0 1px #d9ddff; }
  .side .foot { position: sticky; top: calc(100vh - 70px); font-size: 12px; color: var(--faint); padding: 14px 4px; }
  .side .foot a { color: var(--acc); }
  main { padding: 28px 32px 60px; min-width: 0; }
  h1 { margin: 0; font-size: 24px; font-weight: 700; letter-spacing: -.01em; }
  .sub { margin: 4px 0 0; color: var(--muted); }
  .sec-t { font: 600 12px var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 34px 0 14px; }
  .status { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 14px 18px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); margin-bottom: 18px; }
  .status b { font-weight: 600; margin-right: 8px; }
  .sp { display: inline-flex; align-items: center; gap: 8px; padding: 5px 12px; border-radius: 999px; background: #f0fdf4; color: #166534; font-size: 13px; }
  .sp::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
  .sp em { font-style: normal; color: #6b7280; font-size: 12px; }
  .status .when { margin-left: auto; color: var(--faint); font-size: 12.5px; }
  .grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 14px; }
  .card { all: unset; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px; padding: 18px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); cursor: pointer; transition: border-color .2s, box-shadow .2s; }
  .card:hover { border-color: #c7cdfb; box-shadow: 0 6px 20px rgba(79, 95, 224, .08); }
  .card .hd { display: flex; align-items: center; gap: 12px; }
  .card .ic { width: 34px; height: 34px; border-radius: 9px; background: var(--acc-soft); color: var(--acc); display: grid; place-items: center; flex: none; }
  .card .ic svg { width: 18px; height: 18px; }
  .card b { font-weight: 600; font-size: 15px; line-height: 1.25; }
  .tag { margin-left: auto; flex: none; font: 500 10px var(--sans); letter-spacing: .04em; text-transform: uppercase; color: #b42318; background: #fef3f2; padding: 3px 8px; border-radius: 999px; white-space: nowrap; }
  .card .hd { align-items: flex-start; } .card .hd b { flex: 1 1 0; min-width: 0; padding-top: 6px; }
  .tag.open { color: #3730a3; background: var(--acc-soft); }
  .dom { color: var(--acc); font-size: 13px; font-weight: 500; word-break: break-all; }
  .card p { margin: 0; color: var(--muted); font-size: 13.5px; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 60; background: var(--ink); color: #fff; padding: 12px 16px; border-radius: 12px; box-shadow: 0 16px 40px rgba(0, 0, 0, .2); animation: up .3s ease; max-width: calc(100vw - 32px); }
  @keyframes up { from { transform: translate(-50%, 12px); opacity: 0; } }
  @media (max-width: 1560px) { .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  @media (max-width: 1200px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (max-width: 860px) { .app { grid-template-columns: 1fr; } .side { display: none; } main { padding: 22px 16px 50px; } .grid { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 560px) { .grid { grid-template-columns: 1fr; } }
  .mbrand { display: none; }
  @media (max-width: 860px) { .mbrand { display: flex; align-items: center; gap: 8px; font-weight: 700; letter-spacing: .02em; padding-bottom: 16px; margin-bottom: 18px; border-bottom: 1px solid var(--line); } .mbrand small { font: 600 10px var(--mono); color: var(--acc); background: var(--acc-soft); padding: 3px 8px; border-radius: 999px; } .status { gap: 8px; } .status .when { margin-left: 0; width: 100%; } }
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">EQUILIBRA <small>HUB</small></div>
    <button class="nav" data-go="int" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Piattaforme</button>
    <button class="nav" data-go="dir"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 12 16 8"/><path d="M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0z"/></svg>Direzione</button>
    <button class="nav" data-go="pub"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>Pubblico</button>
    <div class="foot">Demo di <a href="../../lavori.html" target="_top">Reef 7 Lab</a>: azienda e dati di esempio.</div>
  </aside>
  <main>
    <div class="mbrand">EQUILIBRA <small>HUB</small></div>
    <h1>Equilibra Hub</h1>
    <p class="sub">Tutte le piattaforme in sviluppo e in produzione, in un posto solo.</p>

    <p class="sec-t" id="int">Piattaforme interne</p>
    <div class="status" id="status"></div>
    <div class="grid" id="g-int"></div>

    <p class="sec-t" id="dir">Direzione e controllo</p>
    <div class="grid" id="g-dir"></div>

    <p class="sec-t" id="pub">Pubblico e acquisizione</p>
    <div class="grid" id="g-pub"></div>
  </main>
</div>

<script>
(() => {
  const I = {
    crm: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/>',
    coach: '<path d="M22 10 12 5 2 10l10 5 10-5z"/><path d="M6 12v5c3 2 9 2 12 0v-5"/>',
    phone: '<rect x="6" y="2" width="12" height="20" rx="2"/><path d="M11 18h2"/>',
    mail: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>',
    play: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="m10 9 5 3-5 3z"/>',
    chart: '<path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/>',
    bars: '<path d="M6 20V10M12 20V4M18 20v-7"/>',
    doc: '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/>',
    tv: '<rect x="2" y="7" width="20" height="13" rx="2"/><path d="m8 3 4 4 4-4"/>',
    cal: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18M9 15l2 2 4-4"/>',
    org: '<rect x="9" y="3" width="6" height="5" rx="1"/><rect x="3" y="16" width="6" height="5" rx="1"/><rect x="15" y="16" width="6" height="5" rx="1"/><path d="M12 8v4M6 16v-2h12v2"/>',
    globe: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>',
    video: '<rect x="2" y="6" width="14" height="12" rx="2"/><path d="m22 8-6 4 6 4z"/>',
    brief: '<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',
    user: '<circle cx="9" cy="7" r="4"/><path d="M2 21v-2a4 4 0 0 1 4-4h6a4 4 0 0 1 4 4v2M19 8l2 2 4-4"/>',
  };
  const svg = (k) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${I[k]}</svg>`;
  // [nome, icona, dominio, accesso, descrizione, link]
  const INT = [
    ["CRM Vendite", "crm", "sales.equilibra.app", "", "CRM delle venditrici: lead, KPI, classifica, pagamenti, commissioni, insoluti.", "../crm-demo/index.html"],
    ["App Coach", "coach", "coach.equilibra.app", "", "Piattaforma delle nutrizioniste: clienti, piani alimentari, check settimanali, chat.", ""],
    ["App Clienti", "phone", "app.equilibra.app", "", "Lato cliente del Metodo Equilibra: percorso, piano alimentare, progressi, account.", ""],
    ["Equilibra Email", "mail", "email.equilibra.app", "Login team", "Email marketing interno: sequenze, segmenti, warm-up, liste di esclusione.", ""],
    ["Content Hub", "play", "content.equilibra.app", "Login team", "Pipeline dei contenuti: dalle riprese al montaggio, approvazione e pubblicazione.", ""],
    ["Equilibra Hiring", "user", "hiring.equilibra.app", "Login team", "Selezione del personale: posizioni aperte, candidati, colloqui con scorecard.", ""],
    ["Equilibra Social", "chart", "social.equilibra.app", "Login team", "Statistiche dei profili social e dei competitor, con i consigli della settimana.", ""],
  ];
  const DIR = [
    ["Controllo di Gestione", "bars", "cdg.equilibra.app", "Direzione", "KPI, cash e marginalità per prodotto, aggiornati ogni notte.", ""],
    ["Bilancio", "doc", "bilancio.equilibra.app", "Direzione", "Bilancio gestionale mese per mese: stato patrimoniale, conto economico, rendiconto.", ""],
    ["Dashboard TV", "tv", "sales.equilibra.app/tv", "Admin", "Tabellone per lo schermo in ufficio: cash, classifica, setter, marketing. Si aggiorna ogni 5 minuti.", ""],
    ["Prenotazioni", "cal", "calendario.equilibra.app", "Pubblica", "Pagina di prenotazione della discovery con assegnazione automatica: il lead torna sempre alla sua venditrice.", ""],
    ["Organigramma", "org", "team.equilibra.app", "Direzione", "Struttura del team: ruoli, responsabili, reparti.", ""],
  ];
  const PUB = [
    ["Sito Equilibra", "globe", "equilibra.it", "", "Sito pubblico del Metodo Equilibra.", ""],
    ["Webinar gratuito", "video", "webinar.equilibra.it", "", "Landing dei webinar di lancio e delle masterclass.", ""],
    ["Lavora con noi", "brief", "equilibra.it/carriere", "", "Tutte le posizioni aperte, in un'unica pagina.", ""],
    ["Candidature venditrici", "user", "equilibra.it/candidature-sales", "", "Pagina candidature per il team vendita.", ""],
    ["Candidature nutrizioniste", "coach", "equilibra.it/candidature-coach", "", "Pagina candidature per il team coach.", ""],
  ];
  const $ = (s) => document.querySelector(s);
  const toast = (t) => { document.querySelector(".toast")?.remove(); const e = document.createElement("div"); e.className = "toast"; e.textContent = t; document.body.append(e); setTimeout(() => e.remove(), 3000); };
  const card = ([n, ic, dom, acc, d, link]) => `<button class="card" data-n="${n}" data-link="${link}"><span class="hd"><span class="ic">${svg(ic)}</span><b>${n}</b>${acc ? `<span class="tag">${acc}</span>` : link ? `<span class="tag open">Demo</span>` : ""}</span><span class="dom">${dom}</span><p>${d}</p></button>`;
  $("#g-int").innerHTML = INT.map(card).join("");
  $("#g-dir").innerHTML = DIR.map(card).join("");
  $("#g-pub").innerHTML = PUB.map(card).join("");
  document.addEventListener("click", (e) => {
    const c = e.target.closest(".card"); if (c) { if (c.dataset.link) location.href = c.dataset.link; else toast(`${c.dataset.n}: in questa demo si apre solo il CRM Vendite.`); }
    const n = e.target.closest(".nav"); if (n) { document.querySelectorAll(".nav").forEach((x) => x.removeAttribute("aria-current")); n.setAttribute("aria-current", "page"); document.getElementById(n.dataset.go).scrollIntoView({ behavior: "smooth" }); }
  });
  // stato delle piattaforme, ricontrollato ogni 2 minuti
  const SVC = [["CRM vendite", 99], ["App coach", 137], ["App clienti", 121], ["Piattaforma email", 117], ["Content Hub", 98], ["API CRM", 190]];
  const renderStatus = () => {
    $("#status").innerHTML = `<b>Stato piattaforme</b>${SVC.map(([n, b]) => `<span class="sp">${n} <em>${Math.round(b * (.85 + Math.random() * .3))} ms</em></span>`).join("")}<span class="when">controllato alle ${new Date().toLocaleTimeString("it-IT", { hour: "2-digit", minute: "2-digit" })} · ogni 2 minuti</span>`;
  };
  renderStatus(); setInterval(renderStatus, 120000);
})();
</script>
</body>
</html>
